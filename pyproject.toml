[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolution-elite-table"
version = "0.1.0"
description = "Reproducible evolutionary program search for autoresearch training benchmarks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eet = "evolution_elite_table.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evolution_elite_table = ["assets/*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
